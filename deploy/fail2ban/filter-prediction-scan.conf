# Fail2ban — scans et abus sur l'application de prédiction
# À placer dans /etc/fail2ban/filter.d/prediction-scan.conf (sur l'HÔTE).
#
# 404/400 : recherche de chemins (wp-login, .env, ...). 403 : requête refusée (CSRF, accès interdit).
# 429 : limite de débit nginx dépassée (nécessite `limit_req_status 429;` dans prediction.conf).
# Les assets statiques manquants sont ignorés pour ne pas bannir un utilisateur légitime.

[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ [^"]*" (?:400|403|404|429) .*$

ignoreregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ [^"]*\.(?:css|js|map|ico|png|jpg|svg|woff2?) [^"]*" 404
