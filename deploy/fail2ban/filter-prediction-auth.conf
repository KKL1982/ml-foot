# Fail2ban — échecs de connexion à l'application de prédiction
# À placer dans /etc/fail2ban/filter.d/prediction-auth.conf (sur l'HÔTE).
#
# L'application ne renvoie pas 401 : un POST /Account/Login échoué réaffiche le formulaire (200),
# alors qu'une connexion réussie redirige (302). Le verrouillage Identity (5 échecs / 15 min) est
# aussi renvoyé en 200. Un 200 sur ce POST = un échec.

[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /Account/Login[^"]*" 200 .*$

ignoreregex =
