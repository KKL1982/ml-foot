# À copier sur le VPS : /opt/nginx-ui/nginx/conf.d/prediction.conf
# Adapter server_name, le chemin du certificat et le nom du réseau Docker (voir README ci-dessous).
limit_req_zone $binary_remote_addr zone=prediction:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=predictionauth:10m rate=10r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name prediction.dbdesignandcodereview.com;

    ssl_certificate     /etc/letsencrypt/live/dbdesignandcodereview.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbdesignandcodereview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;

    access_log /etc/nginx/logs/prediction-access.log combined;
    error_log  /etc/nginx/logs/prediction-error.log warn;

    # Upload des CSV de la page Batch
    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://football-prediction:7575;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    # Les prédictions batch avec récupération en ligne peuvent être longues
    proxy_read_timeout 180s;
    proxy_send_timeout 60s;

    # Connexion : limitation stricte anti brute-force
    location /Account/ {
        limit_req zone=predictionauth burst=5 nodelay;
        proxy_pass $app;
    }

    location = /api/health {
        access_log off;
        proxy_pass $app;
    }

    location / {
        limit_req zone=prediction burst=60 nodelay;
        proxy_pass $app;
    }
}

server {
    listen 80;
    server_name prediction.dbdesignandcodereview.com;
    return 301 https://$server_name$request_uri;
}
